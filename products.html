<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | POSpro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #ff9933;
            --primary-glow: rgba(255, 153, 51, 0.4);
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #ff9933 0%, #ff5e3a 100%);
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 153, 51, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 94, 58, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: none; /* Hidden until auth check */
            flex-direction: column;
        }

        body.authenticated {
            display: flex;
        }

        /* Navbar */
        nav {
            padding: 1.25rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 3rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .bulk-actions {
            display: none;
            gap: 1rem;
            margin-right: 1rem;
            padding-right: 1rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 10px 20px -10px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px var(--primary-glow);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .btn-success:hover {
            background: #22c55e;
            color: white;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Table Styles */
        .card-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(15, 23, 42, 0.5);
            padding: 1.25rem 1.5rem;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .actions {
            display: flex;
            gap: 0.75rem;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--primary);
        }

        .action-btn.delete:hover {
            color: var(--danger);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal {
            background: var(--bg-dark);
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
        }

        .modal-header h2 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-family: inherit;
        }

        .modal-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--primary);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            transform: translateY(100px);
            transition: all 0.4s ease;
            z-index: 3000;
        }

        .toast.show {
            transform: translateY(0);
        }

        /* Stock Badge */
        .stock-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .stock-low { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .stock-ok { background: rgba(34, 197, 94, 0.1); color: var(--success); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">POSpro</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="customers.html" class="nav-link">Customers</a>
            <a href="products.html" class="nav-link active">Products</a>
            <a href="#" class="nav-link">Invoices</a>
        </div>
        <button class="btn btn-ghost" id="logout-btn">Logout</button>
    </nav>

    <main>
        <div class="header-section">
            <h1>Product Inventory</h1>
            <div class="header-actions">
                <div id="bulk-actions" class="bulk-actions">
                    <button class="btn btn-danger" onclick="bulkDelete()">Delete Selected</button>
                    <button class="btn btn-success" onclick="exportExcel()">Export Excel</button>
                    <button class="btn btn-primary" style="background: #3b82f6;" onclick="exportPDF()">Export PDF</button>
                </div>
                <button class="btn btn-primary" onclick="openModal()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Product
                </button>
            </div>
        </div>

        <div class="card-container">
            <table id="products-table">
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" id="select-all" onclick="toggleSelectAll()"></th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price (₹)</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-body">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add New Product</h2>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="name">Product Name *</label>
                        <input type="text" id="name" required placeholder="e.g. Wireless Mouse">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g. Electronics">
                    </div>
                    <div class="form-group">
                        <label for="price">Price (₹)</label>
                        <input type="number" id="price" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group full-width">
                        <label for="stock">Current Stock</label>
                        <input type="number" id="stock" required placeholder="0">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast">
        <div id="toast-msg">Success!</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://esfttasgrcnwneyorrsq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzZnR0YXNncmNud25leW9ycnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjU2MDYsImV4cCI6MjA5MzgwMTYwNn0.GGS6HPrHVdZeq2jUEPaXDwkw8IMwfiTrZ3s6hys0FgA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = session.user;
            document.body.classList.add('authenticated');
            loadProducts();
        }

        document.getElementById('logout-btn').onclick = async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        };

        function openModal(product = null) {
            const modal = document.getElementById('product-modal');
            const form = document.getElementById('product-form');
            form.reset();
            document.getElementById('product-id').value = '';

            if (product) {
                document.getElementById('modal-title').innerText = 'Edit Product';
                document.getElementById('product-id').value = product.id;
                document.getElementById('name').value = product.name;
                document.getElementById('category').value = product.category;
                document.getElementById('price').value = product.price;
                document.getElementById('stock').value = product.stock;
            } else {
                document.getElementById('modal-title').innerText = 'Add New Product';
            }
            modal.style.display = 'flex';
        }

        function closeModal() { document.getElementById('product-modal').style.display = 'none'; }

        async function loadProducts() {
            const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
            if (error) return console.error(error);

            const tbody = document.getElementById('products-body');
            tbody.innerHTML = '';

            data.forEach(p => {
                const tr = document.createElement('tr');
                const stockClass = p.stock < 10 ? 'stock-low' : 'stock-ok';
                tr.innerHTML = `
                    <td><input type="checkbox" class="product-checkbox" value="${p.id}" onclick="updateBulkActions()"></td>
                    <td>${p.name}</td>
                    <td>${p.category || '-'}</td>
                    <td>₹${parseFloat(p.price).toFixed(2)}</td>
                    <td><span class="stock-badge ${stockClass}">${p.stock} units</span></td>
                    <td class="actions">
                        <button class="action-btn" onclick='editProduct(${JSON.stringify(p)})'>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button class="action-btn delete" onclick="deleteProduct(${p.id})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            updateBulkActions();
        }

        window.editProduct = (p) => openModal(p);

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const productData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                user_id: currentUser.id
            };

            let res;
            if (id) res = await supabaseClient.from('products').update(productData).eq('id', id);
            else res = await supabaseClient.from('products').insert([productData]);

            if (res.error) {
                if (res.error.code === '23505') showToast('Error: Product name already exists.');
                else showToast('Error: ' + res.error.message);
            } else {
                showToast(id ? 'Product updated!' : 'Product added!');
                closeModal();
                loadProducts();
            }
        };

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            const { error } = await supabaseClient.from('products').delete().eq('id', id);
            if (error) showToast(error.message);
            else { showToast('Product deleted'); loadProducts(); }
        }

        function toggleSelectAll() {
            const checked = document.getElementById('select-all').checked;
            document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = checked);
            updateBulkActions();
        }

        function updateBulkActions() {
            const selected = document.querySelectorAll('.product-checkbox:checked').length;
            document.getElementById('bulk-actions').style.display = selected > 0 ? 'flex' : 'none';
        }

        async function bulkDelete() {
            const ids = Array.from(document.querySelectorAll('.product-checkbox:checked')).map(cb => cb.value);
            if (!confirm(`Delete ${ids.length} products?`)) return;
            const { error } = await supabaseClient.from('products').delete().in('id', ids);
            if (error) showToast(error.message);
            else { showToast(`${ids.length} products deleted`); loadProducts(); }
        }

        async function exportExcel() {
            const { data } = await supabaseClient.from('products').select('name, category, price, stock');
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Products");
            XLSX.writeFile(wb, "POSpro_Products.xlsx");
        }

        async function exportPDF() {
            const { data } = await supabaseClient.from('products').select('name, category, price, stock');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Product Inventory List", 14, 15);
            doc.autoTable({
                startY: 20,
                head: [['Name', 'Category', 'Price', 'Stock']],
                body: data.map(p => [p.name, p.category, p.price, p.stock]),
                theme: 'grid',
                headStyles: { fillColor: [255, 153, 51] }
            });
            doc.save("POSpro_Products.pdf");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        checkAuth();
    </script>
</body>
</html>
