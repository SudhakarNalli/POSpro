<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Reports | POSpro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --primary: #ff9933;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #ff9933 0%, #ff5e3a 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 10%, rgba(255, 153, 51, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(255, 94, 58, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: none;
            flex-direction: column;
        }
        body.authenticated { display: flex; }

        nav {
            padding: 1.25rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        .nav-links { display: flex; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--text-muted); font-weight: 500; transition: color 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: var(--primary); }

        main { flex: 1; padding: 3rem 4rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        .filter-section {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            align-items: flex-end;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { color: var(--text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
        input, select { 
            padding: 0.75rem; 
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            color: white; 
            font-family: inherit;
        }

        .btn { padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; transition: all 0.2s; }
        .btn-primary { background: var(--accent-gradient); color: white; }
        .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-success { background: #22c55e; color: white; }

        .report-card { background: var(--bg-card); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(15, 23, 42, 0.5); padding: 1.25rem 1.5rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 1.25rem 1.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

        .summary-banner {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .summary-box {
            background: rgba(255, 153, 51, 0.1);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 153, 51, 0.2);
            flex: 1;
        }
        .summary-val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        /* Custom Multi-Select Dropdown */
        .multi-select-container {
            position: relative;
            width: 100%;
        }

        .multi-select-header {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .multi-select-header:hover {
            border-color: var(--primary);
        }

        .multi-select-header::after {
            content: '▾';
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .multi-select-options {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            padding: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }

        .multi-select-container.open .multi-select-options {
            display: block;
        }

        .select-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .select-option:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .select-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .select-option label {
            margin-bottom: 0;
            text-transform: none;
            color: inherit;
            font-weight: 400;
            cursor: pointer;
            flex: 1;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">POSpro</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="customers.html" class="nav-link">Customers</a>
            <a href="products.html" class="nav-link">Products</a>
            <a href="invoices.html" class="nav-link">Invoices</a>
            <a href="reports.html" class="nav-link active">Reports</a>
        </div>
        <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </nav>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Sales Analysis Report</h1>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-success" onclick="exportExcel()">Export Excel</button>
                <button class="btn btn-primary" onclick="exportPDF()">Export PDF</button>
            </div>
        </div>

        <div class="filter-section" style="grid-template-columns: 280px 1fr 1fr 1fr 220px; overflow: visible; align-items: flex-end;">
            <div class="form-group">
                <label style="font-size: 0.7rem;">Date Range</label>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="date" id="filter-from" style="padding: 0.5rem; font-size: 0.75rem; flex: 1;">
                    <span style="color: var(--text-muted); font-size: 0.7rem;">to</span>
                    <input type="date" id="filter-to" style="padding: 0.5rem; font-size: 0.75rem; flex: 1;">
                </div>
            </div>
            <div class="form-group">
                <label>Categories</label>
                <div class="multi-select-container" id="container-category">
                    <div class="multi-select-header" onclick="toggleDropdown('category')">All Categories</div>
                    <div id="filter-category" class="multi-select-options"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Products</label>
                <div class="multi-select-container" id="container-product">
                    <div class="multi-select-header" onclick="toggleDropdown('product')">All Products</div>
                    <div id="filter-product" class="multi-select-options"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Customers</label>
                <div class="multi-select-container" id="container-customer">
                    <div class="multi-select-header" onclick="toggleDropdown('customer')">All Customers</div>
                    <div id="filter-customer" class="multi-select-options"></div>
                </div>
            </div>
            <div class="form-group" style="flex-direction: row; gap: 0.5rem;">
                <button class="btn btn-primary" onclick="generateReport()" style="padding: 0.75rem; font-size: 0.85rem; flex: 1;">Generate</button>
                <button class="btn btn-ghost" onclick="resetFilters()" style="padding: 0.75rem; font-size: 0.8rem; flex: 1;">Reset</button>
            </div>
        </div>
        <p style="margin-top: -1.5rem; margin-bottom: 2rem; font-size: 0.7rem; color: var(--text-muted);">* Select multiple options using checkboxes</p>

        <div class="summary-banner" id="summary-banner" style="display: none;">
            <div class="summary-box">
                <label>Total Sales</label>
                <div class="summary-val" id="sum-total">₹0</div>
            </div>
            <div class="summary-box">
                <label>Total Tax (GST)</label>
                <div class="summary-val" id="sum-tax">₹0</div>
            </div>
            <div class="summary-box">
                <label>Invoice Count</label>
                <div class="summary-val" id="sum-count">0</div>
            </div>
        </div>

        <div class="report-card">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Inv #</th>
                        <th>Customer</th>
                        <th>Items</th>
                        <th>Tax</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="report-body">
                    <tr><td colspan="6" style="text-align: center; padding: 4rem; color: var(--text-muted);">Set filters and click Generate Report</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://esfttasgrcnwneyorrsq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzZnR0YXNncmNud25leW9ycnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjU2MDYsImV4cCI6MjA5MzgwMTYwNn0.GGS6HPrHVdZeq2jUEPaXDwkw8IMwfiTrZ3s6hys0FgA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let reportData = [];

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            document.body.classList.add('authenticated');
            loadFilters();
        }

        async function loadFilters() {
            const [custs, prods] = await Promise.all([
                supabaseClient.from('customers').select('id, name'),
                supabaseClient.from('products').select('id, name, category')
            ]);
            
            const cSel = document.getElementById('filter-customer');
            custs.data?.forEach(c => {
                cSel.innerHTML += `
                    <div class="select-option" onclick="event.stopPropagation()">
                        <input type="checkbox" id="cust-${c.id}" value="${c.id}" class="cust-check" onchange="updateHeaderText('customer')">
                        <label for="cust-${c.id}">${c.name}</label>
                    </div>
                `;
            });
            
            const pSel = document.getElementById('filter-product');
            prods.data?.forEach(p => {
                pSel.innerHTML += `
                    <div class="select-option" onclick="event.stopPropagation()">
                        <input type="checkbox" id="prod-${p.id}" value="${p.id}" class="prod-check" onchange="updateHeaderText('product')">
                        <label for="prod-${p.id}">${p.name}</label>
                    </div>
                `;
            });

            const catSel = document.getElementById('filter-category');
            const categories = [...new Set(prods.data?.map(p => p.category).filter(Boolean))];
            categories.forEach(cat => {
                catSel.innerHTML += `
                    <div class="select-option" onclick="event.stopPropagation()">
                        <input type="checkbox" id="cat-${cat}" value="${cat}" class="cat-check" onchange="updateHeaderText('category')">
                        <label for="cat-${cat}">${cat}</label>
                    </div>
                `;
            });
        }

        function toggleDropdown(type) {
            const container = document.getElementById(`container-${type}`);
            const wasOpen = container.classList.contains('open');
            
            // Close all
            document.querySelectorAll('.multi-select-container').forEach(c => c.classList.remove('open'));
            
            if (!wasOpen) container.classList.add('open');
        }

        // Close dropdowns on click outside
        window.onclick = function(event) {
            if (!event.target.closest('.multi-select-container')) {
                document.querySelectorAll('.multi-select-container').forEach(c => c.classList.remove('open'));
            }
        };

        function updateHeaderText(type) {
            const checked = document.querySelectorAll(`.${type === 'customer' ? 'cust' : type === 'product' ? 'prod' : 'cat'}-check:checked`);
            const header = document.querySelector(`#container-${type} .multi-select-header`);
            const label = type.charAt(0).toUpperCase() + type.slice(1) + 's';
            
            if (checked.length === 0) header.innerText = `All ${label}`;
            else if (checked.length === 1) header.innerText = checked[0].nextElementSibling.innerText;
            else header.innerText = `${checked.length} Selected`;
        }

        async function generateReport() {
            const from = document.getElementById('filter-from').value;
            const to = document.getElementById('filter-to').value;
            
            if (from && to && new Date(to) < new Date(from)) {
                return alert("Oops! 'To Date' cannot be earlier than 'From Date'. Please check your range.");
            }

            const selectedCusts = Array.from(document.querySelectorAll('.cust-check:checked')).map(cb => cb.value);
            const selectedProds = Array.from(document.querySelectorAll('.prod-check:checked')).map(cb => cb.value);
            const selectedCats = Array.from(document.querySelectorAll('.cat-check:checked')).map(cb => cb.value);

            let query = supabaseClient.from('invoices').select('*, customers(name), invoice_items(*, products(name, category))');
            
            if (from) query = query.gte('created_at', from);
            if (to) query = query.lte('created_at', to + 'T23:59:59');
            
            // In Supabase, .in() works for arrays
            if (selectedCusts.length > 0) query = query.in('customer_id', selectedCusts);

            const { data, error } = await query.order('created_at', { ascending: false });
            if (error) return alert(error.message);

            // Client-side filtering for Products and Categories (nested data)
            reportData = data.filter(inv => {
                const matchesProd = selectedProds.length === 0 || 
                    inv.invoice_items.some(item => selectedProds.includes(item.product_id.toString()));
                
                const matchesCat = selectedCats.length === 0 || 
                    inv.invoice_items.some(item => selectedCats.includes(item.products.category));

                return matchesProd && matchesCat;
            });

            renderReport();
        }

        function resetFilters() {
            document.getElementById('filter-from').value = '';
            document.getElementById('filter-to').value = '';
            document.querySelectorAll('.filter-section input[type="checkbox"]').forEach(cb => cb.checked = false);
            ['customer', 'product', 'category'].forEach(updateHeaderText);
            reportData = [];
            renderReport();
        }

        function renderReport() {
            const tbody = document.getElementById('report-body');
            tbody.innerHTML = '';
            
            let totalRev = 0, totalTax = 0;

            reportData.forEach(inv => {
                totalRev += parseFloat(inv.total_amount);
                totalTax += parseFloat(inv.tax_amount);
                
                const itemsStr = inv.invoice_items.map(it => `${it.products.name} (x${it.quantity})`).join(', ');

                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(inv.created_at).toLocaleDateString()}</td>
                        <td>#${inv.id}</td>
                        <td>${inv.customers?.name || 'Walk-in'}</td>
                        <td style="font-size: 0.8rem; color: var(--text-muted); max-width: 300px;">${itemsStr}</td>
                        <td>₹${parseFloat(inv.tax_amount).toFixed(2)}</td>
                        <td style="font-weight: 700; color: var(--primary);">₹${parseFloat(inv.total_amount).toFixed(2)}</td>
                    </tr>
                `;
            });

            document.getElementById('summary-banner').style.display = 'flex';
            document.getElementById('sum-total').innerText = `₹${totalRev.toLocaleString()}`;
            document.getElementById('sum-tax').innerText = `₹${totalTax.toLocaleString()}`;
            document.getElementById('sum-count').innerText = reportData.length;
        }

        function exportExcel() {
            const data = reportData.map(inv => ({
                Date: new Date(inv.created_at).toLocaleDateString(),
                Invoice: inv.id,
                Customer: inv.customers?.name,
                Subtotal: inv.subtotal,
                Tax: inv.tax_amount,
                Total: inv.total_amount
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sales Report");
            XLSX.writeFile(wb, "POSpro_Sales_Report.xlsx");
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Sales Analysis Report", 14, 15);
            doc.autoTable({
                startY: 20,
                head: [['Date', 'Inv #', 'Customer', 'Tax', 'Total']],
                body: reportData.map(inv => [
                    new Date(inv.created_at).toLocaleDateString(),
                    inv.id,
                    inv.customers?.name,
                    `₹${inv.tax_amount}`,
                    `₹${inv.total_amount}`
                ]),
                theme: 'grid',
                headStyles: { fillColor: [255, 153, 51] }
            });
            doc.save("POSpro_Sales_Report.pdf");
        }

        async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
        init();
    </script>
</body>
</html>
